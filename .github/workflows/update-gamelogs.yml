name: Update NBA game logs

on:
  schedule:
    # 11:17 UTC = 6:17 AM Eastern (7:17 AM during daylight time), after the night's games are final.
    - cron: "17 11 * * *"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull game logs from ESPN box scores
        # NBA.com doesn't answer GitHub's servers, so the workflow uses ESPN.
        run: python fetch_gamelogs_espn.py --out data/gamelogs.json

      - name: Save the new file to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/gamelogs.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update NBA game logs $(date -u +%Y-%m-%d)"
            git pull --rebase
            git push
          fi
