name: Update sportsbook lines

on:
  schedule:
    # Twice a day: about 10:43 AM and 5:43 PM Eastern (times are UTC).
    # The free SportsGameOdds plan allows 2,500 games a month; two NBA runs a day use roughly 300-600.
    - cron: "43 15 * * *"
    - cron: "43 22 * * *"
  workflow_dispatch: # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write

concurrency:
  group: data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull sportsbook lines from SportsGameOdds
        env:
          SGO_API_KEY: ${{ secrets.SGO_API_KEY }}
        # More leagues: --leagues NBA,NFL (each league's games count toward the monthly limit)
        run: python fetch_sportsbook.py --leagues NBA --out data/sportsbook.json

      - name: Save the new file to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/sportsbook.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update sportsbook lines $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
